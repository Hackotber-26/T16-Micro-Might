# Keeps the demo fully offline (no usage stats; fonts served from ./static) and matches the design system in nija/ui.py
[browser]
gatherUsageStats = false

[server]
headless = false
maxUploadSize = 50
enableStaticServing = true

[theme]
base = "light"
primaryColor = "#0B4F4A"
backgroundColor = "#FBF6EA"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#14201D"
